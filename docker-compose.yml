version: "3.9"

services:
  backend:
    build: .
    container_name: pqms-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./data/results.db
      - OUTPUT_PATH=./reports

  frontend:
    image: node:20-alpine
    container_name: pqms-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend

  dashboard:
    build: .
    container_name: pqms-dashboard
    command: ["streamlit", "run", "dashboard/dashboard_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.enableCORS", "false"]
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend
