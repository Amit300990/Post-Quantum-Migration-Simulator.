version: "3.9"

services:
  backend:
    build: .
    container_name: pqms-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./data/results.db
      - OUTPUT_PATH=./reports

  dashboard:
    build: .
    container_name: pqms-dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.enableCORS", "false"]
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend
